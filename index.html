<!DOCTYPE html>
<html lang="id"><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAS EF - ADMIN FINAL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f8fafc;color:#0f172a;max-width:500px;margin:0 auto}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10}
.logo{font-weight:900;font-size:16px} .badge{font-size:8px;background:#0f172a;color:#fff;padding:3px 6px;border-radius:99px;margin-left:6px}
.sub{font-size:10px;color:#0e7490;font-weight:700}
.btn{border:1px solid #e2e8f0;background:#fff;border-radius:999px;padding:7px 12px;font-size:11px;font-weight:700;cursor:pointer}
.btn-primary{background:#0f172a;color:#fff} .btn-danger{background:#fef2f2;color:#dc2626;border-color:#fecaca} .btn-sm{padding:5px 9px;font-size:10px}
.wrap{padding:12px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:14px}
.saldo{font-size:28px;font-weight:900;margin-top:4px}
.label{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#64748b;font-weight:700}
.meta{font-size:10px;color:#64748b;margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mini{border:1px solid #e2e8f0;border-radius:10px;padding:10px;background:#f8fafc}
.input{width:100%;padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px;font-size:13px}
.textarea{width:100%;min-height:90px;padding:10px;border:1px dashed #94a3b8;border-radius:10px;font-size:12px;font-family:monospace;background:#f8fafc;resize:vertical}
.anggota-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kotak{border-radius:12px;padding:10px 8px;text-align:center;background:#f8fafc;border:1px solid #e2e8f0}
.kotak.min{background:#fff1f2;border-color:#fecdd3} .kotak.max{background:#ecfdf5;border-color:#a7f3d0}
.kotak-name{font-size:10px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .kotak-nom{font-size:11px;font-weight:800;margin-top:2px}
.tx-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;margin-bottom:6px;gap:8px}
.bank{display:inline-flex;padding:2px 6px;border-radius:999px;font-size:8px;font-weight:800;border:1px solid transparent;margin-left:4px}
.bca{background:#dbeafe;color:#1e40af} .mandiri{background:#fef9c3;color:#713f12} .cash{background:#dcfce7;color:#166534}
.wa-item{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:10px;margin-bottom:6px;font-size:11px;border:1px solid #e2e8f0;background:#f8fafc} .wa-item.ok{background:#ecfdf5;border-color:#a7f3d0}
</style></head><body>
<header>
<div><div class="logo">KAS EF <span class="badge">ADMIN FINAL</span></div><div class="sub">PT. Astra Komponen Indonesia</div></div>
<div style="display:flex;gap:6px"><button class="btn btn-sm" onclick="loadData()">↻ Sync</button><button class="btn btn-sm btn-primary" onclick="exportJSON()">Backup</button></div>
</header>
<div class="wrap">
<div class="card">
<div class="label">Saldo Real-Time • <span id="count">0 anggota</span> • <span id="status">Ready</span> <span id="warn" style="color:#dc2626"></span></div>
<div class="saldo" id="saldo">Rp 0</div>
<div class="meta"><span id="syncinfo">Local</span> • <span id="txc">0 trx</span></div>
<div class="grid2"><div class="mini"><div class="label">Masuk</div><div style="font-weight:800" id="masuk">Rp 0</div></div><div class="mini"><div class="label">Keluar</div><div style="font-weight:800" id="keluar">Rp 0</div></div></div>
</div>
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div class="label">Daftar Transaksi</div><div style="display:flex;gap:6px"><button class="btn btn-sm" onclick="loadData()">↻</button><button class="btn btn-sm btn-danger" onclick="hapusDobels()">Hapus Dobel</button><button class="btn btn-sm btn-danger" onclick="perbaikiDataError()">Fix Error</button></div></div>
<div id="txlist" style="max-height:320px;overflow:auto"></div>
</div>
<div class="card">
<div class="label" style="margin-bottom:8px">Tambah Iuran</div>
<div style="display:flex;flex-direction:column;gap:8px">
<input type="date" id="f-date" class="input">
<select id="f-member" class="input"></select>
<div style="display:flex;gap:8px"><select id="f-metode" class="input"><option value="">Metode</option><option>BCA</option><option>MANDIRI</option><option>CASH</option></select><select id="f-cat" class="input"><option>Iuran</option><option>Kas Keluar</option></select></div>
<input type="number" id="f-amt" class="input" value="100000">
<input type="text" id="f-desc" class="input" placeholder="Keterangan">
<button class="btn btn-primary" onclick="addTx()">💾 Simpan</button>
</div>
</div>
<div class="card" style="background:#f0fdfa;border-color:#a5f3fc">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="label" style="color:#0e7490">Input WA</div><span id="wa-count" style="font-size:10px;background:#fff;border:1px solid #a5f3fc;padding:3px 8px;border-radius:999px">0</span></div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px">
<input type="date" id="wa-tanggal" class="input" style="padding:8px;font-size:11px">
<select id="wa-bulan" class="input" style="padding:8px;font-size:11px"><option value="1">Januari</option><option value="2">Februari</option><option value="3">Maret</option><option value="4">April</option><option value="5">Mei</option><option value="6">Juni</option><option value="7">Juli</option><option value="8">Agustus</option><option value="9">September</option><option value="10">Oktober</option><option value="11">November</option><option value="12">Desember</option></select>
<select id="wa-tahun" class="input" style="padding:8px;font-size:11px"><option>2024</option><option>2025</option><option selected>2026</option><option>2027</option></select>
</div>
<textarea id="wa-paste" class="textarea" placeholder="Nia tf mandiri&#10;Aditya tf BCA&#10;Putri cash"></textarea>
<div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-primary" style="flex:1" onclick="parseWA()">🔍 Deteksi</button><button class="btn" id="wa-save-btn" style="display:none;flex:1;background:#059669;color:#fff" onclick="saveWA()">💾 Simpan</button></div>
<div id="wa-preview" style="margin-top:10px"></div>
<div id="wa-log" style="font-size:11px;margin-top:6px"></div>
</div>
<div class="card">
<div class="label" style="margin-bottom:8px">Iuran Anggota • <span id="acount">0</span> <span id="zero-warn"></span></div>
<div id="alist" class="anggota-grid"></div>
</div>
</div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwZyzfPgJiNbBsxwKAfFxnRq2Iz50g9XYvkXU9CJdfywd9bc9n5bGpv7sXyKSOE3Ux72A/exec";
function fmt(n){return n.toLocaleString('id-ID');}
let txs=[], members=[]; let waParsed=[];
function getDefaultMembers(){return [{name:"Supriyadi"},{name:"Aditya"},{name:"Anisa"},{name:"Syarif"},{name:"Aaf"},{name:"Budi"},{name:"Yudi"},{name:"Dozen"},{name:"Heru"},{name:"Arief"},{name:"Anah"},{name:"Putri"},{name:"Nia"},{name:"Efrizon"},{name:"Kawir"},{name:"Kamal"},{name:"Edy"}];}
function saveLocal(){localStorage.setItem('kas_ef_txs',JSON.stringify(txs)); localStorage.setItem('kas_ef_members',JSON.stringify(members));}
function loadData(){
  let lt=JSON.parse(localStorage.getItem('kas_ef_txs')||'[]');
  let lm=JSON.parse(localStorage.getItem('kas_ef_members')||'[]');
  txs=lt; members=lm.length?lm:getDefaultMembers();
  let uniq={}; members.forEach(m=>{let k=m.name.toLowerCase().trim(); if(k&&!uniq[k]) uniq[k]=m;}); members=Object.values(uniq);
  updateUI();
  document.getElementById('status').textContent='Local • '+txs.length;
  document.getElementById('syncinfo').textContent='Local • '+txs.length+' trx';
  fetch(SCRIPT_URL+'?action=getData&t='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(txt=>{
    try{
      let d=JSON.parse(txt);
      let sheetTxs=d.transaksi.map(x=>{
        let raw=x.Nominal; let amt=0;
        if(typeof raw==='number') amt=raw;
        else { let s=String(raw||'').replace(/[^0-9]/g,''); amt=parseInt(s)||0; if(s.length>8){ let m=s.match(/(100000|200000)$/); if(m) amt=parseInt(m[1]); else amt=parseInt(s.slice(-6))||100000; } }
        if(amt>10000000||amt<1000) amt=100000;
        return {id:x.ID||'s_'+Math.random(), date:String(x.Tanggal||'').slice(0,10), raw:String(x.Tanggal||''), cat:String(x.Kategori||'Iuran').split('|')[0], amt:amt, name:String(x.Anggota||'').trim(), desc:String(x.Kategori||'').split('|').slice(1).join('|')}
      });
      let rawM=(d.anggota||[]).map(r=>({name:String(r.Nama||'').trim()})).filter(x=>x.name&&x.name.toLowerCase()!=='aktif');
      let um={}; rawM.forEach(m=>{let k=m.name.toLowerCase(); if(k&&!um[k]) um[k]=m;}); let sheetMembers=Object.values(um);
      if(sheetMembers.length>=5) members=sheetMembers;
      if(sheetTxs.length>=txs.length){ txs=sheetTxs; saveLocal(); }
      updateUI();
      document.getElementById('status').textContent='Sheet OK • '+txs.length;
      document.getElementById('syncinfo').textContent='Sheet: '+sheetTxs.length+' trx • '+new Date().toLocaleTimeString('id-ID');
    }catch(e){ console.log(e); }
  }).catch(e=>{ console.log(e); });
}
function updateUI(){
  let masuk=0,keluar=0; txs.forEach(t=>{if(t.cat==='Kas Keluar') keluar+=t.amt; else masuk+=t.amt;});
  document.getElementById('saldo').textContent='Rp '+fmt(masuk-keluar);
  document.getElementById('masuk').textContent='Rp '+fmt(masuk); document.getElementById('keluar').textContent='Rp '+fmt(keluar);
  document.getElementById('count').textContent=members.length+' anggota'; document.getElementById('txc').textContent=txs.length+' trx'; document.getElementById('acount').textContent=members.length;
  document.getElementById('f-member').innerHTML=members.map(m=>'<option value="'+m.name+'">'+m.name+'</option>').join('');
  let warn=document.getElementById('warn'); if(masuk>1000000000){ warn.textContent='⚠️ ERROR '+fmt(masuk)+' >1M - Klik Fix Error'; warn.style.cursor='pointer'; warn.onclick=perbaikiDataError; } else warn.textContent='';
  let list=document.getElementById('txlist');
  if(!txs.length) list.innerHTML='<div style="text-align:center;padding:20px;color:#94a3b8">Belum ada transaksi</div>';
  else list.innerHTML=txs.slice().sort((a,b)=>new Date(b.raw||b.date)-new Date(a.raw||a.date)).slice(0,100).map(t=>{
    let low=(t.desc||'').toLowerCase(); let logo=low.includes('bca')?'<span class="bank bca">BCA</span>':low.includes('mandiri')?'<span class="bank mandiri">MANDIRI</span>':low.includes('cash')?'<span class="bank cash">CASH</span>':'';
    return `<div class="tx-item"><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:11px">${t.name} ${logo}</div><div style="font-size:9px;color:#64748b">${t.date} • ${t.desc||''} • Rp ${fmt(t.amt)}</div></div><div style="display:flex;gap:6px;align-items:center"><div style="font-weight:800;font-size:11px">Rp ${fmt(t.amt)}</div><button onclick="delTx('${t.id}')" class="btn btn-sm btn-danger">✕</button></div></div>`;
  }).join('');
  let map={}; members.forEach(m=>map[m.name.toLowerCase()]={total:0,name:m.name}); txs.forEach(t=>{let k=t.name.toLowerCase(); if(map[k]!==undefined) map[k].total+=t.amt;});
  let arr=Object.values(map); let minT=arr.length?Math.min(...arr.map(x=>x.total)):0; let maxT=arr.length?Math.max(...arr.map(x=>x.total)):0; arr.sort((a,b)=>a.total-b.total);
  let zero=arr.filter(x=>x.total===0);
  document.getElementById('zero-warn').innerHTML=zero.length?`<span style="color:#dc2626">⚠️ ${zero.length} Rp 0: ${zero.map(x=>x.name).join(', ')}</span>`:'<span style="color:#059669">✅ Semua ada iuran</span>';
  document.getElementById('alist').innerHTML=arr.map(m=>{
    let cls=m.total===minT?'kotak min':(m.total===maxT&&maxT>minT)?'kotak max':'kotak';
    return `<div class="${cls}"><div class="kotak-name">${m.name}</div><div class="kotak-nom">Rp ${fmt(m.total)}</div></div>`;
  }).join('');
}
function addTx(){
  let date=document.getElementById('f-date').value||new Date().toISOString().slice(0,10);
  let member=document.getElementById('f-member').value; let metode=document.getElementById('f-metode').value; let cat=document.getElementById('f-cat').value; let amt=parseInt(document.getElementById('f-amt').value)||0; let desc=document.getElementById('f-desc').value||'Iuran';
  if(metode) desc=desc+' '+metode;
  if(!member||!amt){alert('Lengkapi');return;}
  txs.push({id:'tx_'+Date.now(), date, raw:date, cat, amt, name:member, desc, metode}); saveLocal(); updateUI(); send({action:'addTransaksi',Tanggal:date,Anggota:member,Kategori:cat+'|'+desc,Nominal:amt});
}
function delTx(id){if(!confirm('Hapus?')) return; txs=txs.filter(t=>String(t.id)!==String(id)); saveLocal(); updateUI(); send({action:'deleteTransaksi',ID:id});}
function hapusDobels(){let seen={}; let dob=[]; txs.forEach(t=>{let k=(t.name+'|'+(t.desc||'').toLowerCase()+'|'+t.amt).toLowerCase(); if(seen[k]) dob.push(t); else seen[k]=true;}); if(!dob.length){alert('Tidak ada dobel');return;} if(!confirm('Hapus '+dob.length+' dobel?')) return; dob.forEach(d=>{txs=txs.filter(t=>t.id!==d.id); send({action:'deleteTransaksi',ID:d.id});}); saveLocal(); updateUI();}
function perbaikiDataError(){ let err=txs.filter(t=>t.amt>10000000); if(!err.length){ alert('Tidak ada error >10jt'); return; } if(!confirm('Hapus '+err.length+' transaksi error triliunan?')) return; err.forEach(t=>{ txs=txs.filter(x=>x.id!==t.id); send({action:'deleteTransaksi',ID:t.id}); }); saveLocal(); updateUI(); alert('Dihapus '+err.length+' error'); }
function extractMetode(l){l=l.toLowerCase(); if(l.includes('bca')) return 'BCA'; if(l.includes('mandiri')) return 'MANDIRI'; if(l.includes('cash')) return 'CASH'; return '';}
function extractName(line){let c=line.replace(/(tf|transfer|cash|bca|mandiri|bri|bni|100k|200k|Rp|\d+\.\d+)/gi,'').trim(); c=c.replace(/[^a-zA-Z ]/g,' ').replace(/\s+/g,' ').trim(); c=c.replace(/^pak\s+/i,''); let p=c.split(' ').filter(x=>x.length>1); if(!p.length) return ''; let name=p.slice(0,2).join(' '); return name.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()).join(' ');}
function extractAmt(line){let m=line.match(/(\d+)k/i); if(m) return parseInt(m[1])*1000; let m2=line.match(/(\d{3,})/); if(m2) return parseInt(m2[1])||100000; return 100000;}
function parseWA(){
  let text=document.getElementById('wa-paste').value; let lines=text.split(/\n/); let seen={}; let res=[]; let dup=[];
  let alias={"pak heru":"Heru","heru":"Heru","opik":"Opik","topik":"Opik","zaelani":"Zaelani"};
  lines.forEach(raw=>{let line=raw.trim(); if(!line||line.length<2) return; if(/^(terima kasih|makasih|thanks|ok)/i.test(line)) return; let name=extractName(line); let amt=extractAmt(line); let met=extractMetode(line); if(name){ let low=name.toLowerCase(); if(alias[low]) name=alias[low]; let k=name.toLowerCase(); if(seen[k]) dup.push({name,raw:line}); else {seen[k]=true; res.push({name,amt,metode:met,raw:line});}}});
  let bulan=document.getElementById('wa-bulan'); let tahun=document.getElementById('wa-tahun'); let bulanNames=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember']; let bName=bulanNames[parseInt(bulan.value)]; let tVal=tahun.value; let target=(bName+' '+tVal).toLowerCase(); let already=[]; let toSave=[];
  res.forEach(r=>{let has=txs.some(t=> t.name.toLowerCase()===r.name.toLowerCase() && (t.desc||'').toLowerCase().includes(target)); if(has) already.push(r); else toSave.push(r);});
  waParsed=toSave;
  let preview=document.getElementById('wa-preview'); let log=document.getElementById('wa-log'); let btn=document.getElementById('wa-save-btn'); let count=document.getElementById('wa-count');
  if(!toSave.length && !already.length && !dup.length){preview.innerHTML='<div class="wa-item" style="background:#fff1f2">❌ Tidak ada nama</div>'; btn.style.display='none'; return;}
  preview.innerHTML=toSave.map(r=>{
    let logo=r.metode==='BCA'?'<span class="bank bca">BCA</span>':r.metode==='MANDIRI'?'<span class="bank mandiri">MANDIRI</span>':r.metode==='CASH'?'<span class="bank cash">CASH</span>':'';
    return `<div class="wa-item ok"><div><b>${r.name}</b> ${logo}<div style="font-size:9px;color:#64748b">${r.raw}</div></div><div style="font-weight:800">Rp ${r.amt.toLocaleString('id-ID')}</div></div>`;
  }).join('') || '<div class="wa-item" style="background:#fff1f2">Semua sudah bayar / dobel</div>';
  log.innerHTML=`✅ Preview ${toSave.length} orang • Rp ${(toSave.length*100000).toLocaleString('id-ID')} untuk ${bName} ${tVal} ${already.length?`<br>⛔ ${already.length} sudah bayar: ${already.map(x=>x.name).join(', ')}`:''} ${dup.length?`<br>⚠️ ${dup.length} dobel paste`:''}`;
  count.textContent=toSave.length; btn.style.display=toSave.length?'inline-flex':'none';
}
function saveWA(){
  if(!waParsed.length){alert('Parse dulu');return;}
  let date=document.getElementById('wa-tanggal').value||new Date().toISOString().slice(0,10);
  let bulan=document.getElementById('wa-bulan'); let tahun=document.getElementById('wa-tahun'); let bulanNames=['','Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember']; let bName=bulanNames[parseInt(bulan.value)]; let tVal=tahun.value; let desc='Iuran '+bName+' '+tVal+' via WA';
  if(!confirm(`Simpan ${waParsed.length} untuk ${bName} ${tVal}?`)) return;
  waParsed.forEach(r=>{let full=desc+(r.metode?' '+r.metode:''); if(!members.some(m=>m.name.toLowerCase()===r.name.toLowerCase())){ members.push({name:r.name}); send({action:'addAnggota',Nama:r.name}); } txs.push({id:'wa_'+Date.now()+Math.random(), date, raw:date, cat:'Iuran', amt:r.amt, name:r.name, desc:full, metode:r.metode}); send({action:'addTransaksi',Tanggal:date,Anggota:r.name,Kategori:'Iuran|'+full,Nominal:r.amt});});
  saveLocal(); updateUI(); document.getElementById('wa-preview').innerHTML=`<div class="wa-item ok">✅ ${waParsed.length} tersimpan</div>`; document.getElementById('wa-log').textContent='Selesai'; document.getElementById('wa-save-btn').style.display='none'; document.getElementById('wa-paste').value=''; waParsed=[];
}
function send(p){let j=JSON.stringify(p); fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:j}).catch(()=>{let q=Object.keys(p).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(p[k])).join('&'); let img=new Image(); img.src=SCRIPT_URL+'?'+q+'&t='+Date.now();});}
function exportJSON(){let d={transaksi:txs, anggota:members, time:new Date().toISOString()}; let b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}); let u=URL.createObjectURL(b); let a=document.createElement('a'); a.href=u; a.download='KAS-EF-'+new Date().toISOString().slice(0,10)+'.json'; a.click();}
let now=new Date(); document.getElementById('f-date').value=now.toISOString().slice(0,10); document.getElementById('wa-tanggal').value=now.toISOString().slice(0,10); document.getElementById('wa-bulan').value=now.getMonth()+1;
