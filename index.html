<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kas EF AsKI LIVE</title>
<style>*{box-sizing:border-box;font-family:system-ui}body{margin:0;background:#f6f3ff}.wrap{max-width:480px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.08);margin-bottom:12px}.h1{font-size:26px;font-weight:900}.badge{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800}.live{background:#dcfce7;color:#166534}.saldo{font-size:36px;font-weight:900;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{padding:12px;border-radius:14px;background:#f8f7ff}.mini b{font-size:18px;display:block}input,select,button{width:100%;padding:12px;border-radius:12px;border:1px solid #ddd;margin-top:8px}button{background:#6d28d9;color:#fff;border:none;font-weight:800}.item{border-bottom:1px solid #eee;padding:10px 0;display:flex;justify-content:space-between}</style>
</head><body><div class="wrap">
<div class="card"><div class="h1">Kas EF AsKI</div><span class="badge live">🟢 LIVE Sync Aktif</span><div>Saldo Saat Ini</div><div id="saldo" class="saldo">Rp 3.300.000</div><div class="grid"><div class="mini">Pemasukan<b id="masuk">Rp 0</b></div><div class="mini">Pengeluaran<b id="keluar">Rp 0</b></div></div></div>
<div class="card"><b>Tambah Transaksi</b><div style="display:flex;gap:8px"><select id="tipe"><option value="keluar">Pengeluaran</option><option value="masuk">Pemasukan</option></select><input id="ket" placeholder="Keterangan"></div><input id="nom" type="number" placeholder="Nominal"><button onclick="simpan()">Simpan & Sync</button></div>
<div class="card"><b>Riwayat</b><div id="list"></div><button style="background:#eee;color:#333" onclick="exp()">Export CSV</button></div>
</div>
<script>
let awal=3300000;let data=JSON.parse(localStorage.getItem('kas')||'[]');
function simpan(){let tipe=document.getElementById('tipe').value;let ket=document.getElementById('ket').value||'-';let nom=parseInt(document.getElementById('nom').value||'0');if(!nom)return alert('Isi nominal');data.unshift({t:Date.now(),tipe,ket,nom});localStorage.setItem('kas',JSON.stringify(data));document.getElementById('ket').value='';document.getElementById('nom').value='';render();}
function render(){let m=0,k=0;data.forEach(d=>{if(d.tipe=='masuk')m+=d.nom;else k+=d.nom});document.getElementById('masuk').textContent='Rp '+m.toLocaleString('id-ID');document.getElementById('keluar').textContent='Rp '+k.toLocaleString('id-ID');document.getElementById('saldo').textContent='Rp '+(awal+m-k).toLocaleString('id-ID');document.getElementById('list').innerHTML=data.map(d=>`<div class=item><div><b>${d.ket}</b><br><small>${new Date(d.t).toLocaleString('id-ID')}</small></div><b>${d.tipe=='masuk'?'+':'-'}${d.nom.toLocaleString('id-ID')}</b></div>`).join('')||'Belum ada';}
function exp(){let csv='Tgl,Tipe,Ket,Nom\n'+data.map(d=>`${new Date(d.t).toLocaleString()},${d.tipe},${d.ket},${d.nom}`).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='kas.csv';a.click();}
render();
</script></body></html>
