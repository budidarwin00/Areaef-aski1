<!DOCTYPE html>
<html lang="id">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kas Area EF V25 - Anti Blank - Multi Device</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;background:#F6F7F9}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin-bottom:8px}
.btn{border-radius:999px;padding:6px 12px;font-size:11px;font-weight:700;border:1px solid #e5e7eb}
.btn-black{background:#111;color:#fff;border-color:#111}
.btn-red{background:#ef4444;color:#fff;border-color:#ef4444}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
</style>
</head>
<body class="max-w-[480px] mx-auto p-3 pb-20">
<!-- HEADER KECIL -->
<div class="card flex justify-between items-center p-2.5">
  <div class="flex gap-2 items-center">
    <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-cyan-400 to-teal-500 flex items-center justify-center text-white font-bold text-[10px]">EF</div>
    <div>
      <div class="font-bold text-[10px] uppercase tracking-wide">LAPORAN KAS AREA EF</div>
      <div class="text-[8px] text-gray-500">PT. Astra Komponen Indonesia</div>
      <div class="flex gap-1 mt-1 flex-wrap">
        <span id="badge-role" class="text-[7px] px-1.5 py-0.5 rounded-full font-bold border bg-emerald-50 border-emerald-200 text-emerald-700">ANGGOTA</span>
        <span id="badge-device" class="text-[7px] px-1.5 py-0.5 rounded-full bg-gray-50 border">-</span>
        <span id="badge-status" class="text-[7px] px-1.5 py-0.5 rounded-full font-bold border bg-gray-50">IDLE</span>
        <span id="badge-sync" class="text-[7px] px-1.5 py-0.5 rounded-full bg-blue-50 border-blue-200 text-blue-700 border">-</span>
      </div>
    </div>
  </div>
  <div class="flex gap-1">
    <button onclick="exportPDF()" class="btn btn-black text-[9px]">📄 PDF</button>
    <button onclick="syncNow()" id="btn-sync" class="btn btn-red text-[9px]">Sync</button>
    <button onclick="toggleLogin()" id="btn-login" class="btn text-[9px] bg-white">Login</button>
  </div>
</div>

<!-- INFO SYNC MULTI-DEVICE -->
<div class="bg-[#F8FAFC] border rounded-lg px-2.5 py-1.5 flex justify-between text-[8px] text-gray-500 mb-2">
  <span id="info-device">📱 -</span>
  <span id="info-count">0 trx</span>
  <label class="flex items-center gap-1"><input type="checkbox" id="auto-sync" checked class="w-3 h-3"> Auto 15s</label>
</div>

<!-- SALDO -->
<div class="grid grid-cols-3 gap-1.5 mb-2">
  <div class="rounded-[12px] bg-gradient-to-br from-teal-400 to-cyan-600 p-3 text-white">
    <div class="text-[7px] uppercase opacity-80 tracking-widest">Saldo Kas (Awal 0)</div>
    <div id="saldo" class="text-[16px] font-bold mt-1">Rp 0</div>
    <div id="saldo-detail" class="text-[8px] opacity-80 mt-1">0 trx</div>
  </div>
  <div class="card p-2 !mb-0">
    <div class="text-[7px] uppercase text-gray-400 font-bold">Masuk</div>
    <div id="masuk" class="text-[12px] font-bold text-emerald-600">+ 0</div>
  </div>
  <div class="card p-2 !mb-0">
    <div class="text-[7px] uppercase text-gray-400 font-bold">Keluar</div>
    <div id="keluar" class="text-[12px] font-bold text-red-600">- 0</div>
  </div>
</div>

<!-- INPUT MASSAL - HANYA ADMIN -->
<div id="bulk-area" class="card hidden">
  <div class="font-bold text-[9px] uppercase mb-2">Input Massal - Sync ke semua device</div>
  <div class="flex gap-1 mb-2">
    <select id="bulk-cat" class="btn bg-white text-[9px] flex-1">
      <option value="Iuran Bulanan">Iuran 100rb</option>
      <option value="Kas Masuk">Kas Masuk</option>
      <option value="Kas Keluar">Kas Keluar</option>
    </select>
    <input id="bulk-amt" type="number" value="100000" class="btn bg-white text-[9px] w-[70px]">
    <input id="bulk-note" placeholder="Catatan" class="btn bg-white text-[9px] flex-1">
  </div>
  <div id="member-list" class="grid grid-cols-2 gap-1 max-h-[100px] overflow-auto mb-2 text-[9px]"></div>
  <button onclick="saveBulk()" class="btn btn-black w-full text-[9px]">Simpan & Sync Semua Device</button>
</div>

<div id="lock-msg" class="card bg-amber-50 border-amber-200 text-center">
  <div class="text-[9px] font-bold text-amber-800">🔒 Mode Anggota - Data auto-sync dari admin</div>
  <div id="lock-detail" class="text-[8px] text-amber-700 mt-1">Last sync -</div>
</div>

<!-- TRANSAKSI -->
<div class="card">
  <div class="flex justify-between items-center mb-2">
    <div id="tx-title" class="font-bold text-[9px] uppercase">Transaksi - 0</div>
    <button onclick="toggleAdd()" id="btn-add" class="btn btn-black text-[8px] hidden">+ Tambah</button>
  </div>
  <div id="add-form" class="hidden bg-[#F8FAFC] border rounded-lg p-2 mb-2">
    <div class="grid grid-cols-2 gap-1 mb-1">
      <select id="new-cat" class="btn bg-white text-[8px]"><option>Iuran Bulanan</option><option>Kas Masuk</option><option>Kas Keluar</option></select>
      <input id="new-date" type="date" class="btn bg-white text-[8px]">
    </div>
    <div class="grid grid-cols-2 gap-1 mb-1">
      <select id="new-member" class="btn bg-white text-[8px]"></select>
      <input id="new-amt" type="number" value="100000" class="btn bg-white text-[8px]">
    </div>
    <div class="flex gap-1">
      <button onclick="toggleAdd()" class="btn bg-white flex-1 text-[8px]">Batal</button>
      <button onclick="saveSingle()" class="btn btn-black flex-1 text-[8px]">Simpan & Sync</button>
    </div>
  </div>
  <div id="tx-list" class="space-y-1"></div>
</div>

<!-- LOGIN MODAL TANPA HINT PASSWORD -->
<div id="login-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
  <div class="bg-white rounded-[14px] w-full max-w-[300px] p-4 shadow-xl">
    <div class="flex justify-between items-center mb-3">
      <div class="font-bold text-[12px]">🔒 Login Admin</div>
      <button onclick="toggleLogin()" class="w-6 h-6 rounded-full bg-gray-100 flex items-center justify-center">×</button>
    </div>
    <input id="pass-input" type="password" placeholder="Password" class="w-full h-9 rounded-full border px-3 text-[11px] outline-none focus:border-gray-900">
    <div id="pass-err" class="text-[9px] text-red-600 mt-1 hidden"></div>
    <button onclick="doLogin()" class="w-full h-9 rounded-full bg-gray-900 text-white text-[11px] font-bold mt-3">Masuk</button>
  </div>
</div>

<div id="toast" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 bg-black text-white text-[9px] font-bold px-3 py-2 rounded-full shadow-lg z-50 max-w-[90%] text-center"></div>

<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbx8XwkUfgQxXIip6XOQCKAzrJehZACQz2xrb8njsuD1iknAzC_ozJ9ccX1JmiouBjlHkQ/exec";
const DEVICE_ID = localStorage.getItem('kas-device-id') || (()=>{const id='DEV-'+Math.random().toString(36).slice(2,5).toUpperCase();localStorage.setItem('kas-device-id',id);return id;})();
const DEVICE_NAME = localStorage.getItem('kas-device-name') || (()=>{const n='HP-'+Math.floor(Math.random()*90+10);localStorage.setItem('kas-device-name',n);return n;})();
let isAdmin = localStorage.getItem('kas-v25-isAdmin')==='true';
let members = [{id:"1",name:"Andi Saputra"},{id:"2",name:"Budi Santoso"},{id:"3",name:"Cahyo Nugroho"},{id:"4",name:"Dedi Pratama"},{id:"5",name:"Eko Wahyudi"},{id:"6",name:"Fajar H"},{id:"7",name:"Gilang R"},{id:"8",name:"Hendra W"}];
let txs = [];
try{const s=localStorage.getItem('kas-v25-txs');if(s)txs=JSON.parse(s);}catch(e){txs=[{id:"t1",date:"2025-05-02",category:"Iuran Bulanan",amount:100000,memberName:"Andi Saputra"}];}
let lastSync=null;

const fmt=n=>new Intl.NumberFormat("id-ID").format(n);

function showToast(m){
  const el=document.getElementById('toast');
  el.textContent=m;el.classList.remove('hidden');
  setTimeout(()=>el.classList.add('hidden'),3000);
}

function updateUI(){
  document.getElementById('badge-device').textContent=DEVICE_ID;
  document.getElementById('info-device').textContent=`📱 ${DEVICE_NAME} • ${DEVICE_ID} • ${navigator.onLine?'Online':'Offline'}`;
  document.getElementById('info-count').textContent=`${txs.length} trx`;
  document.getElementById('badge-role').textContent=isAdmin?'ADMIN':'ANGGOTA';
  document.getElementById('badge-role').className=`text-[7px] px-1.5 py-0.5 rounded-full font-bold border ${isAdmin?'bg-amber-50 border-amber-200 text-amber-700':'bg-emerald-50 border-emerald-200 text-emerald-700'}`;
  document.getElementById('btn-login').textContent=isAdmin?'Keluar':'Login';
  document.getElementById('btn-add').classList.toggle('hidden',!isAdmin);
  document.getElementById('bulk-area').classList.toggle('hidden',!isAdmin);
  document.getElementById('lock-msg').classList.toggle('hidden',isAdmin);
  if(lastSync){
    document.getElementById('badge-sync').textContent=new Date(lastSync).toLocaleTimeString('id-ID');
    document.getElementById('lock-detail').textContent=`Last sync ${new Date(lastSync).toLocaleTimeString('id-ID')} • ${DEVICE_ID}`;
  }
  const masuk=txs.filter(x=>x.category!=="Kas Keluar").reduce((s,x)=>s+x.amount,0);
  const keluar=txs.filter(x=>x.category==="Kas Keluar").reduce((s,x)=>s+x.amount,0);
  const saldo=masuk-keluar;
  document.getElementById('saldo').textContent='Rp '+fmt(saldo);
  document.getElementById('masuk').textContent='+ '+fmt(masuk);
  document.getElementById('keluar').textContent='- '+fmt(keluar);
  document.getElementById('saldo-detail').textContent=txs.length+' transaksi';
  document.getElementById('tx-title').textContent=`Transaksi - ${txs.length}`;

  // Member list
  const ml=document.getElementById('member-list');
  ml.innerHTML=members.map(m=>`<label class="flex items-center gap-1 rounded-lg border px-2 py-1 bg-[#F8FAFC]"><input type="checkbox" value="${m.id}" class="bulk-cb w-3 h-3"> ${m.name}</label>`).join('');
  const nm=document.getElementById('new-member');
  nm.innerHTML='<option value="">Pilih Anggota</option>'+members.map(m=>`<option value="${m.id}">${m.name}</option>`).join('');

  // Tx list
  const tl=document.getElementById('tx-list');
  tl.innerHTML=txs.slice(0,50).map(t=>`
    <div class="flex justify-between bg-[#F8FAFC] border rounded-lg px-2 py-1.5">
      <div class="flex gap-1.5 items-center">
        <div class="w-1.5 h-1.5 rounded-full ${t.category==='Kas Keluar'?'bg-red-500':'bg-emerald-500'}"></div>
        <div>
          <div class="text-[9px] font-semibold leading-tight">${t.memberName} • ${t.category}</div>
          <div class="text-[7px] text-gray-400">${t.date}</div>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <div class="text-[9px] font-bold ${t.category==='Kas Keluar'?'text-red-600':'text-emerald-600'}">${t.category==='Kas Keluar'?'-':'+'}${fmt(t.amount)}</div>
        ${isAdmin?`<button onclick="delTx('${t.id}')" class="w-4 h-4 rounded-full bg-white border flex items-center justify-center text-[8px]">×</button>`:''}
      </div>
    </div>
  `).join('') || '<div class="text-[9px] text-gray-400 text-center py-3">Kosong</div>';
  localStorage.setItem('kas-v25-txs',JSON.stringify(txs));
}

async function getData(){
  const url=SCRIPT_URL+"?action=getData&t="+Date.now()+"&d="+DEVICE_ID;
  try{
    const r=await fetch(url,{cache:'no-store'});
    if(r.ok)return await r.json();
  }catch(e){}
  try{
    const r=await fetch("https://api.allorigins.win/get?url="+encodeURIComponent(url));
    if(r.ok){const j=await r.json();return JSON.parse(j.contents);}
  }catch(e){}
  throw Error("Gagal");
}
async function postData(p){
  try{
    await fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({...p,deviceId:DEVICE_ID,deviceName:DEVICE_NAME})});
    return true;
  }catch(e){return false;}
}

async function syncNow(show=true){
  if(!navigator.onLine){document.getElementById('badge-status').textContent='OFFLINE';return;}
  document.getElementById('badge-status').textContent='SYNC...';
  document.getElementById('btn-sync').textContent='...';
  try{
    const d=await getData();
    const _tx=d.transaksi||d.transactions||[];
    if(_tx.length){
      const nt=_tx.map((x,i)=>({id:x.ID||"t"+i,date:(x.Tanggal||"").slice(0,10),category:x.Kategori||"Kas Masuk",amount:parseInt(String(x.Nominal||0).replace(/[^0-9]/g,""))||0,memberName:x.Anggota||"",note:x.Keterangan||""})).filter(x=>x.memberName);
      if(nt.length!==txs.length && nt.length>0){
        if(nt.length>txs.length && !show){showToast(`🔄 ${nt.length-txs.length} data baru dari device lain!`);}
        txs=nt;
      }
    }
    lastSync=Date.now();
    document.getElementById('badge-status').textContent='SYNC OK';
    if(show)showToast(`✅ Sync OK • ${DEVICE_ID}`);
  }catch(e){
    document.getElementById('badge-status').textContent='GAGAL';
    if(show)showToast("❌ Gagal sync");
  }
  document.getElementById('btn-sync').textContent='Sync';
  updateUI();
  setTimeout(()=>{document.getElementById('badge-status').textContent='IDLE';},2000);
}

function toggleLogin(){
  const m=document.getElementById('login-modal');
  m.classList.toggle('hidden');
  if(isAdmin){
    isAdmin=false;localStorage.setItem('kas-v25-isAdmin','false');updateUI();m.classList.add('hidden');showToast("Keluar admin");
  }
}
function doLogin(){
  const p=document.getElementById('pass-input').value;
  if(p==="admin123"||p==="efadmin"){
    isAdmin=true;localStorage.setItem('kas-v25-isAdmin','true');
    document.getElementById('login-modal').classList.add('hidden');
    document.getElementById('pass-input').value='';
    document.getElementById('pass-err').classList.add('hidden');
    updateUI();showToast("✅ Login admin");
  }else{
    const e=document.getElementById('pass-err');
    e.textContent="Password salah!";e.classList.remove('hidden');
  }
}
function toggleAdd(){document.getElementById('add-form').classList.toggle('hidden');}
function delTx(id){if(!isAdmin)return;if(!confirm("Hapus?"))return;txs=txs.filter(x=>x.id!==id);updateUI();}

async function saveBulk(){
  const cbs=[...document.querySelectorAll('.bulk-cb:checked')].map(cb=>cb.value);
  if(!cbs.length)return showToast("Pilih anggota");
  const cat=document.getElementById('bulk-cat').value;
  const amt=parseInt(document.getElementById('bulk-amt').value)||100000;
  const note=document.getElementById('bulk-note').value;
  const now=new Date().toISOString().slice(0,10);
  const newItems=cbs.map(id=>{const m=members.find(x=>x.id===id);return{id:"t"+Date.now()+id,date:now,category:cat,amount:cat==="Iuran Bulanan"?100000:amt,memberName:m.name,note};});
  txs=[...newItems,...txs];updateUI();
  for(let it of newItems)await postData({action:"addTransaksi",ID:it.id,Tanggal:it.date,Anggota:it.memberName,Kategori:it.category,Nominal:it.amount,Keterangan:it.note||""});
  showToast(`✅ ${newItems.length} disimpan & sync ke semua device`);
  document.querySelectorAll('.bulk-cb').forEach(cb=>cb.checked=false);
}
async function saveSingle(){
  const cat=document.getElementById('new-cat').value;
  const date=document.getElementById('new-date').value||new Date().toISOString().slice(0,10);
  const mid=document.getElementById('new-member').value;
  const amt=parseInt(document.getElementById('new-amt').value)||100000;
  if(!mid)return alert("Pilih anggota");
  const m=members.find(x=>x.id===mid);
  const item={id:"t"+Date.now(),date,category:cat,amount:cat==="Iuran Bulanan"?100000:amt,memberName:m.name,note:""};
  txs=[item,...txs];document.getElementById('add-form').classList.add('hidden');updateUI();
  await postData({action:"addTransaksi",ID:item.id,Tanggal:item.date,Anggota:item.memberName,Kategori:item.category,Nominal:item.amount,Keterangan:""});
  showToast("✅ Disimpan & sync ke semua device");
}

function exportPDF(){
  try{
    const now=new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    const masuk=txs.filter(x=>x.category!=="Kas Keluar").reduce((s,x)=>s+x.amount,0);
    const keluar=txs.filter(x=>x.category==="Kas Keluar").reduce((s,x)=>s+x.amount,0);
    const html=`<html><head><meta charset="utf-8"><title>Kas EF</title><style>body{font-family:Arial;padding:20px;font-size:11px;max-width:800px;margin:auto}table{width:100%;border-collapse:collapse;font-size:10px}th{background:#f3f4f6;padding:4px;text-align:left}td{padding:4px;border-top:1px solid #eee}</style></head><body>
<h2 style="margin:0;font-size:12px">LAPORAN KAS AREA EF - ${DEVICE_ID}</h2><div style="font-size:10px;color:#666">${now} • ${txs.length} trx</div>
<div style="margin:10px 0">Saldo: Rp ${fmt(masuk-keluar)} | Masuk: Rp ${fmt(masuk)} | Keluar: Rp ${fmt(keluar)}</div>
<table><tr><th>Tgl</th><th>Nama</th><th>Kat</th><th>Nominal</th></tr>${txs.map(t=>`<tr><td>${t.date}</td><td>${t.memberName}</td><td>${t.category}</td><td style="text-align:right;font-weight:700;color:${t.category==="Kas Keluar"?"red":"green"}">${t.category==="Kas Keluar"?"-":"+"}${fmt(t.amount)}</td></tr>`).join("")}</table>
<script>setTimeout(()=>window.print(),500);<\/script></body></html>`;
    const blob=new Blob([html],{type:"text/html"});
    const url=URL.createObjectURL(blob);
    const win=window.open(url,"_blank");
    if(!win){const a=document.createElement("a");a.href=url;a.download=`Kas-EF-${Date.now()}.html`;a.click();}
    showToast("📄 PDF dibuka");
  }catch(e){showToast("❌ Error PDF");}
}

// INIT
document.getElementById('new-date').value=new Date().toISOString().slice(0,10);
document.getElementById('badge-device').textContent=DEVICE_ID;
document.getElementById('info-device').textContent=`📱 ${DEVICE_NAME} • ${DEVICE_ID}`;
updateUI();
syncNow(false);
setInterval(()=>{if(document.getElementById('auto-sync').checked && navigator.onLine)syncNow(false);},15000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow(false);});
window.addEventListener('focus',()=>syncNow(false));
document.getElementById('pass-input').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="ht
