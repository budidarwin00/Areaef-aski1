<html lang="id"><head><style>

</style><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAS EF - Anggota CEPAT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f0fdfa;color:#0f172a;max-width:480px;margin:0 auto}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e2e8f0;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:14px} .live{font-size:10px;color:#059669;font-weight:700;background:#ecfdf5;border:1px solid #a7f3d0;padding:4px 8px;border-radius:999px}
.live.sync{background:#fef9c3;color:#92400e;border-color:#fde68a}
.live.off{background:#fff1f2;color:#dc2626;border-color:#fecdd3}
.btn{border:1px solid #e2e8f0;background:#fff;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:600;cursor:pointer}
.wrap{padding:12px;display:flex;flex-direction:column;gap:12px}
.saldo-card{background:linear-gradient(135deg,#0e7490,#06b6d4);border-radius:18px;padding:16px;color:#fff}
.saldo-label{font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.9;font-weight:700}
.saldo-value{font-size:28px;font-weight:900;margin-top:4px}
.saldo-meta{font-size:10px;opacity:.9;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{background:rgba(255,255,255,.15);border-radius:10px;padding:10px}
.mini-label{font-size:8px;text-transform:uppercase;opacity:.8} .mini-val{font-weight:800;margin-top:2px;font-size:13px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:14px}
.label{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#64748b;font-weight:700}
.anggota-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kotak{border-radius:12px;padding:10px 8px;text-align:center;background:#f8fafc;border:1px solid #e2e8f0}
.kotak.min{background:#fff1f2;border-color:#fecdd3} .kotak.max{background:#ecfdf5;border-color:#a7f3d0}
.kotak-name{font-size:10px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kotak-nom{font-size:11px;font-weight:800;margin-top:2px}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed #e2e8f0;gap:8px}
.bank-row{border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;background:#f8fafc}
.bank-num{font-family:monospace;font-weight:800;font-size:14px}
.bank-copy{border:1px solid #0f172a;background:#0f172a;color:#fff;border-radius:999px;padding:6px 10px;font-size:10px;font-weight:700}
.skeleton{background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%);background-size:200% 100%;animation:shim 1.2s infinite;border-radius:8px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style></head><body>
<header>
<div><div class="logo">KAS EF</div><div style="font-size:10px;color:#0e7490;font-weight:700">PT. Astra Komponen Indonesia</div></div>
<div style="display:flex;gap:6px;align-items:center"><div class="live" id="live-text">⚡ Cache</div><button class="btn" onclick="load(true)">↻ Sync</button></div>
</header>
<div class="wrap">
<div class="saldo-card">
<div class="saldo-label">Saldo Real-Time • <span id="count">17 anggota</span></div>
<div class="saldo-value" id="saldo"><div class="skeleton" style="height:32px;width:180px"></div></div>
<div class="saldo-meta" id="syncinfo">Memuat cepat dari cache...</div>
<div class="grid2" style="margin-top:12px"><div class="mini"><div class="mini-label">MASUK</div><div class="mini-val" id="masuk">-</div></div><div class="mini"><div class="mini-label">KELUAR</div><div class="mini-val" id="keluar">-</div></div></div>
</div>
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="label">Rekening Kas • Transfer Iuran</div><div style="font-size:9px;color:#64748b">TAP COPY</div></div>
<div id="rlist"><div class="skeleton" style="height:50px"></div></div>
</div>
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="label">Iuran Anggota • <span id="acount">0</span></div><div class="label" id="zero-warn"></div></div>
<div id="alist" class="anggota-grid"><div class="skeleton" style="height:40px"></div><div class="skeleton" style="height:40px"></div><div class="skeleton" style="height:40px"></div><div class="skeleton" style="height:40px"></div></div>
</div>
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="label">Transaksi • <span id="txc">0 trx</span></div><div style="font-size:9px;color:#64748b" id="load-time"></div></div>
<div id="txlist"><div class="skeleton" style="height:60px"></div></div>
</div>
</div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbwZyzfPgJiNbBsxwKAfFxnRq2Iz50g9XYvkXU9CJdfywd9bc9n5bGpv7sXyKSOE3Ux72A/exec";
function fmt(n){return n.toLocaleString('id-ID');}
function getDefaultMembers(){return [{name:"Supriyadi"},{name:"Aditya"},{name:"Anisa"},{name:"Syarif"},{name:"Aaf"},{name:"Budi"},{name:"Yudi"},{name:"Dozen"},{name:"Heru"},{name:"Arief"},{name:"Anah"},{name:"Putri"},{name:"Nia"},{name:"Topik"},{name:"Efrizon"},{name:"Kawir"},{name:"Kamal"}];}
function safeAmt(raw){
  let amt=0;
  if(typeof raw==='number') amt=raw;
  else { let s=String(raw||'').replace(/[^0-9]/g,''); amt=parseInt(s)||0; if(s.length>8){ let m=s.match(/(100000|200000)$/); if(m) amt=parseInt(m[1]); else amt=parseInt(s.slice(-6))||100000; } }
  if(amt>10000000||amt<1000) amt=100000; if(amt===0) amt=100000; return amt;
}
function render(d, source){
  let t0=performance.now();
  let txs=d.transaksi.map(x=>{
    let amt=safeAmt(x.Nominal);
    let nm=String(x.Anggota||'').trim(); let low=nm.toLowerCase(); if(low==='opik'||low==='opik-topik') nm='Topik';
    return {id:x.ID, date:String(x.Tanggal||'').slice(0,10), cat:String(x.Kategori||'Iuran').split('|')[0], amt:amt, name:nm}
  });
  txs.sort((a,b)=>new Date(b.date)-new Date(a.date));
  let masuk=0; txs.forEach(t=>{ masuk+=t.amt; });
  document.getElementById('saldo').textContent='Rp '+fmt(masuk);
  document.getElementById('masuk').textContent='Rp '+fmt(masuk);
  document.getElementById('keluar').textContent='Rp 0';
  document.getElementById('txc').textContent=txs.length+' trx';
  // Only render 20 trx for speed
  let tl=document.getElementById('txlist');
  tl.innerHTML=txs.slice(0,20).map(t=>`<div class="row"><div style="flex:1;min-width:0"><div style="font-weight:700;font-size:11px">${t.name}</div><div style="font-size:9px;color:#64748b">${t.date}</div></div><div style="font-weight:800;font-size:11px">Rp ${fmt(t.amt)}</div></div>`).join('');
  let raw=d.anggota||[]; let um={}; raw.forEach(r=>{let nm=String(r.Nama||r.ID||'').trim(); if(!nm||nm.toLowerCase()==='aktif') return; let low=nm.toLowerCase(); if(low==='opik'||low==='opik-topik') nm='Topik'; let k=nm.toLowerCase().replace(/\s+/g,' ').trim(); if(!um[k]) um[k]={name:nm};});
  let members=Object.values(um); if(members.length<5) members=getDefaultMembers();
  if(members.length>17){ let tmp={}; let arr=[]; members.forEach(m=>{let k=m.name.toLowerCase(); if(!tmp[k]&&arr.length<17){ tmp[k]=true; arr.push(m); }}); members=arr; }
  document.getElementById('count').textContent=members.length+' anggota'; document.getElementById('acount').textContent=members.length;
  let map={}; members.forEach(m=>map[m.name.toLowerCase()]={total:0,name:m.name});
  txs.forEach(t=>{let k=t.name.toLowerCase(); if(map[k]!==undefined) map[k].total+=t.amt;});
  let arr=Object.values(map); let minT=arr.length?Math.min(...arr.map(x=>x.total)):0; let maxT=arr.length?Math.max(...arr.map(x=>x.total)):0; arr.sort((a,b)=>a.total-b.total);
  let zero=arr.filter(x=>x.total===0);
  document.getElementById('zero-warn').innerHTML=zero.length?`<span style="color:#dc2626">⚠️ ${zero.length} Rp 0</span>`:'<span style="color:#059669">✅ Sinkron</span>';
  document.getElementById('alist').innerHTML=arr.map(m=>{
    let cls=m.total===minT?'kotak min':(m.total===maxT&&maxT>minT)?'kotak max':'kotak';
    return `<div class="${cls}"><div class="kotak-name">${m.name}</div><div class="kotak-nom">Rp ${fmt(m.total)}</div></div>`;
  }).join('');
  let rb=d.bank||[]; let banks=rb.map(r=>({name:r.Bank||r.NamaBank||'Bank', number:r.NoRek||r.Rekening||'', owner:r.Pemilik||'Eka Iswanto'})).filter(b=>b.number);
  if(banks.length===0) banks=[{name:'BCA', number:'6830747280', owner:'Eka Iswanto'},{name:'MANDIRI', number:'1570005764080', owner:'Eka Iswanto'}];
  document.getElementById('rlist').innerHTML=banks.map(b=>`<div class="bank-row"><div><div style="font-size:10px;color:#64748b;font-weight:700">${b.name} • ${b.owner}</div><div class="bank-num">${b.number}</div></div><button class="bank-copy" onclick="navigator.clipboard.writeText('${b.number}');this.textContent='✓';setTimeout(()=>this.textContent='Copy',1000)">Copy</button></div>`).join('');
  let t1=performance.now();
  document.getElementById('load-time').textContent=(t1-t0).toFixed(0)+'ms • '+source;
  return {txs,members};
}
function load(force=false){
  let cached=localStorage.getItem('kas_ef_last_data');
  let hasCache=!!cached;
  if(hasCache && !force){
    try{
      let d=JSON.parse(cached);
      render(d,'⚡ Cache (0ms)');
      document.getElementById('live-text').textContent='⚡ Cache • '+d.transaksi.length+' trx';
      document.getElementById('live-text').className='live';
      document.getElementById('syncinfo').textContent='⚡ Tampil dari cache • Sync background...';
    }catch(e){}
  } else if(!hasCache){
    document.getElementById('syncinfo').textContent='Memuat dari Sheet...';
  }
  // Background sync with timeout 6s
  let controller=new AbortController();
  let timeout=setTimeout(()=>controller.abort(), 6000);
  document.getElementById('live-text').textContent='🔄 Sync...';
  document.getElementById('live-text').className='live sync';
  fetch(SCRIPT_URL+'?action=getData&t='+Date.now(),{cache:'no-store', signal:controller.signal}).then(r=>r.text()).then(txt=>{
    clearTimeout(timeout);
    let d=JSON.parse(txt);
    localStorage.setItem('kas_ef_last_data',txt);
    localStorage.setItem('kas_ef_last_sync', new Date().toISOString());
    render(d,'Live');
    document.getElementById('live-text').textContent='LIVE • '+d.transaksi.length+' • '+(new Date().toLocaleTimeString('id-ID'));
    document.getElementById('live-text').className='live';
    document.getElementById('syncinfo').textContent='✅ Live • '+new Date().toLocaleTimeString('id-ID')+' • '+d.transaksi.length+' trx • Cepat';
  }).catch(e=>{
    clearTimeout(timeout);
    document.getElementById('live-text').textContent=hasCache?'⚡ Cache':'Offline';
    document.getElementById('live-text').className=hasCache?'live':'live off';
    if(hasCache){
      document.getElementById('syncinfo').textContent='⚡ Pakai cache (Sheet lambat) • Klik Sync lagi';
    } else {
      document.getElementById('syncinfo').textContent='Offline • Sheet lambat, coba lagi • '+e.message;
    }
  });
}
// Load instantly from cache
load(false);
// Auto background sync after 800ms (biar cache tampil dulu)
setTimeout(()=>{ if(localStorage.getItem('kas_ef_last_data')) load(false); }, 800);
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body></html>
