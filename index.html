<script>
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz9hzTgKSYAKp1u39ftbASW4MpM2r4-1M_aWngzoZLSbfl8xYK4VSlo3l-e2xtKHqhM/exec";
var DEFAULT_17_MEMBERS=[{id:"m-nia",name:"Nia"},{id:"m-aditya",name:"Aditya"},{id:"m-anisa",name:"Anisa"},{id:"m-aaf",name:"Aaf"},{id:"m-syarif",name:"Syarif"},{id:"m-budi",name:"Budi"},{id:"m-topik",name:"Topik"},{id:"m-yudi",name:"Yudi"},{id:"m-heru",name:"Heru"},{id:"m-dozen",name:"Dozen"},{id:"m-putri",name:"Putri"},{id:"m-arief",name:"Arief"},{id:"m-anah",name:"Anah"},{id:"m-supriyadi",name:"Supriyadi"},{id:"m-zaelani",name:"Zaelani"},{id:"m-eka",name:"Eka"},{id:"m-nely",name:"Nely"}];
var DEFAULT_BANKS=[{id:"b-eka-bca",name:"BCA",number:"6830747280",owner:"Eka Iswanto"},{id:"b-eka-mandiri",name:"MANDIRI",number:"1570005764080",owner:"Eka Iswanto"}];
var isAdmin=false;var members=DEFAULT_17_MEMBERS.slice();var banks=DEFAULT_BANKS.slice();var txs=[];var filteredTxs=[];var displayLimit=10;var deletedTxIds=[];var deletedMemberIds=[];var deletedBankIds=[];var STORAGE_KEY="kas-v84-final-locked";var lastSyncTime=0;var autoSyncInterval=null;var isSyncing=false;
function fmt(n){try{return new Intl.NumberFormat("id-ID").format(n||0);}catch(e){return n;}}
function toast(m){var el=document.getElementById('toast');el.textContent=m;el.style.display='block';setTimeout(function(){el.style.display='none';},3500);}
function toggleLogin(){var m=document.getElementById('login-modal');if(isAdmin){isAdmin=false;localStorage.setItem(STORAGE_KEY+'-admin','0');updateUI();m.style.display='none';toast('Mode ANGGOTA');return;}m.style.display=m.style.display==='flex'?'none':'flex';setTimeout(function(){document.getElementById('pass-input').focus();},100);}
function doLogin(){var p=document.getElementById('pass-input').value.trim().toLowerCase();var err=document.getElementById('pass-err');if(p==="askief"){isAdmin=true;localStorage.setItem(STORAGE_KEY+'-admin','1');document.getElementById('login-modal').style.display='none';document.getElementById('pass-input').value='';err.style.display='none';updateUI();toast('\uD83D\uDD13 ADMIN V84 - Real-time ON');}else{err.textContent='Password salah!';err.style.display='block';toast('❌ Salah!');}}
function setTab(t){document.getElementById('view-dashboard').style.display=t==='dashboard'?'block':'none';document.getElementById('view-anggota').style.display=t==='anggota'?'block':'none';document.getElementById('view-rekening').style.display=t==='rekening'?'block':'none';document.getElementById('tab-dashboard').className=t==='dashboard'?'tab tab-active':'tab';document.getElementById('tab-anggota').className=t==='anggota'?'tab tab-active':'tab';document.getElementById('tab-rekening').className=t==='rekening'?'tab tab-active':'tab';}
function toggleAdd(){var f=document.getElementById('add-form');f.style.display=f.style.display==='none'?'block':'none';}
function toggleRekForm(){if(!isAdmin){toast('\uD83D\uDD12 Login admin');toggleLogin();return;}var f=document.getElementById('rekening-form');f.style.display=f.style.display==='none'?'block':'none';}
function toggleAnggotaForm(){if(!isAdmin){toast('\uD83D\uDD12 Login admin (askief)');toggleLogin();return;}var f=document.getElementById('anggota-form');f.style.display=f.style.display==='none'?'block':'none';}
function setLimit(n){displayLimit=n;document.getElementById('btn-10').className=n===10?'btn btn-teal':'btn';document.getElementById('btn-20').className=n===20?'btn btn-teal':'btn';document.getElementById('btn-all').className=n===1000?'btn btn-teal':'btn';updateUI();}
function selectAll(){document.querySelectorAll('.bulk-cb').forEach(function(cb){cb.checked=true;});}
function deselectAll(){document.querySelectorAll('.bulk-cb').forEach(function(cb){cb.checked=false;});}
function closeConfirm(){document.getElementById('confirm-modal').style.display='none';}
var lastCopyNumber='';function copyRek(number,bankName){lastCopyNumber=String(number).trim();if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(lastCopyNumber).then(function(){toast('✅ '+lastCopyNumber+' disalin!');showCopyModal(lastCopyNumber,bankName);}).catch(function(){showCopyModal(lastCopyNumber,bankName);});}else{showCopyModal(lastCopyNumber,bankName);}}
function showCopyModal(number,bankLabel){lastCopyNumber=number;var modal=document.getElementById('copy-modal');var inp=document.getElementById('copy-show-input');var label=document.getElementById('copy-bank-label');if(label)label.textContent=(bankLabel||'Rekening')+' - Eka Iswanto';if(inp)inp.value=number;modal.style.display='flex';setTimeout(function(){if(inp){try{inp.focus();inp.select();inp.setSelectionRange(0,99999);}catch(e){}}},300);}
function closeCopyModal(){document.getElementById('copy-modal').style.display='none';}
function copyManualAgain(){var inp=document.getElementById('copy-show-input');if(inp){inp.focus();inp.select();try{inp.setSelectionRange(0,99999);}catch(e){}}try{var ok=document.execCommand('copy');if(ok){toast('✅ '+lastCopyNumber+' disalin!');setTimeout(closeCopyModal,800);}else{toast('Tap-tahan → Select All → Copy');}}catch(e){}}
function saveAll(){try{localStorage.setItem(STORAGE_KEY+'-txs',JSON.stringify(txs));localStorage.setItem(STORAGE_KEY+'-members',JSON.stringify(members));localStorage.setItem(STORAGE_KEY+'-banks',JSON.stringify(banks));localStorage.setItem(STORAGE_KEY+'-deletedTxs',JSON.stringify(deletedTxIds));localStorage.setItem(STORAGE_KEY+'-deletedMembers',JSON.stringify(deletedMemberIds));localStorage.setItem(STORAGE_KEY+'-deletedBanks',JSON.stringify(deletedBankIds));localStorage.setItem(STORAGE_KEY+'-admin',isAdmin?'1':'0');}catch(e){}}
function loadAll(){try{var sTxs=localStorage.getItem(STORAGE_KEY+'-txs');if(sTxs)txs=JSON.parse(sTxs);var sM=localStorage.getItem(STORAGE_KEY+'-members');if(sM)members=JSON.parse(sM);var sB=localStorage.getItem(STORAGE_KEY+'-banks');if(sB)banks=JSON.parse(sB);var sDelT=localStorage.getItem(STORAGE_KEY+'-deletedTxs');if(sDelT)deletedTxIds=JSON.parse(sDelT);var sDelM=localStorage.getItem(STORAGE_KEY+'-deletedMembers');if(sDelM)deletedMemberIds=JSON.parse(sDelM);var sDelB=localStorage.getItem(STORAGE_KEY+'-deletedBanks');if(sDelB)deletedBankIds=JSON.parse(sDelB);var sAdmin=localStorage.getItem(STORAGE_KEY+'-admin');if(sAdmin==='1')isAdmin=true;if(members.length===0)members=DEFAULT_17_MEMBERS.slice();if(banks.length===0)banks=DEFAULT_BANKS.slice();txs=txs.filter(function(t){return deletedTxIds.indexOf(t.id)===-1;});members=members.filter(function(m){return deletedMemberIds.indexOf(m.id)===-1;});banks=banks.filter(function(b){return deletedBankIds.indexOf(b.id)===-1;});filteredTxs=txs.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date);});}catch(e){filteredTxs=txs.slice();}}loadAll();
function saveSingle(){var cat=document.getElementById('new-cat').value;var date=document.getElementById('new-date').value||new Date().toISOString().slice(0,10);var mid=document.getElementById('new-member').value;var amt=parseInt(document.getElementById('new-amt').value)||0;if(!mid){toast('⚠️ Pilih anggota');return;}var m=members.find(function(x){return x.id===mid;});var item={id:"t"+Date.now()+"_"+mid,date:date,category:cat,amount:amt,memberName:m.name};txs.unshift(item);filteredTxs=txs.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date);});saveAll();updateUI();toast('✅ '+m.name+' sync!');toggleAdd();try{fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"addTransaksi",ID:item.id,Tanggal:item.date,Anggota:item.memberName,Kategori:item.category,Nominal:item.amount})});}catch(e){}}
function saveBulk(){var cbs=document.querySelectorAll('.bulk-cb:checked');if(!cbs.length){toast('⚠️ Pilih anggota!');return;}var now=new Date().toISOString().slice(0,10);var count=0;cbs.forEach(function(cb){var m=members.find(function(x){return x.id===cb.value;});if(m){var it={id:"t"+Date.now()+count+"_"+m.id,date:now,category:"Iuran Bulanan",amount:100000,memberName:m.name};txs.unshift(it);try{fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"addTransaksi",ID:it.id,Tanggal:it.date,Anggota:it.memberName,Kategori:it.category,Nominal:it.amount})});}catch(e){}count++;}});filteredTxs=txs.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date);});saveAll();updateUI();toast('✅ '+count+' iuran sync!');cbs.forEach(function(cb){cb.checked=false;});}
function addMember(){var input=document.getElementById('new-anggota-nama');var nama=input.value.trim();if(!nama){toast('⚠️ Isi nama');return;}if(members.some(function(m){return m.name.toLowerCase()===nama.toLowerCase();})){toast('⚠️ Sudah ada');return;}var newM={id:"m"+Date.now(),name:nama};members.push(newM);input.value='';saveAll();updateUI();toast('✅ '+nama+' sync!');document.getElementById('anggota-form').style.display='none';try{fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"addAnggota",ID:newM.id,Nama:nama})});}catch(e){}}
function addBank(){var bank=document.getElementById('rek-bank').value.trim().toUpperCase();var no=document.getElementById('rek-no').value.trim();if(!bank||!no){toast('⚠️ Isi Bank & No');return;}var newB={id:"b"+Date.now(),name:bank,number:no,owner:"Eka Iswanto"};banks.push(newB);document.getElementById('rek-bank').value='';document.getElementById('rek-no').value='';saveAll();updateUI();toast('✅ Rek '+bank+' sync!');toggleRekForm();try{fetch(SCRIPT_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({action:"addBank",ID:newB.id,Bank:newB.name,"No Rekening":newB.number,Pemilik:newB.owner})});}catch(e){}}
