<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kas EF</title><style>body{margin:0;background:#f5f3ff;font-family:sans-serif}.w{max-width:480px;margin:auto;padding:14px}.c{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 4px 12px #0001}.s{font-size:32px;font-weight:900}.b{background:#dcfce7;color:#166534;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:800}button{width:100%;padding:12px;border-radius:12px;border:none;background:#6d28d9;color:#fff;font-weight:800;margin-top:8px}input,select{width:100%;padding:10px;border-radius:10px;border:1px solid #ddd;margin-top:6px}.it{border-bottom:1px solid #eee;padding:8px 0;display:flex;justify-content:space-between}</style></head><body><div class="w"><div class="c"><h2>Kas EF AsKI</h2><span class="b">🟢 LIVE Aktif</span><div>Saldo</div><div id="saldo" class="s">Rp 3.300.000</div><div id="m">Masuk: Rp 0</div><div id="k">Keluar: Rp 0</div></div><div class="c"><b>Tambah</b><select id="t"><option value="keluar">Pengeluaran</option><option value="masuk">Pemasukan</option></select><input id="ke" placeholder="Keterangan"><input id="no" type="number" placeholder="Nominal"><button onclick="s()">Simpan</button></div><div class="c"><b>Riwayat</b><div id="l"></div></div></div><script>let A=3300000;let D=JSON.parse(localStorage.getItem('kas')||'[]');function s(){let t=document.getElementById('t').value,k=document.getElementById('ke').value||'-',n=parseInt(document.getElementById('no').value||0);if(!n)return alert('isi nominal');D.unshift({t:Date.now(),tipe:t,ket:k,nom:n});localStorage.setItem('kas',JSON.stringify(D));document.getElementById('ke').value='';document.getElementById('no').value='';r()}function r(){let m=0,k=0;D.forEach(d=>{if(d.tipe=='masuk')m+=d.nom;else k+=d.nom});document.getElementById('m').textContent='Masuk: Rp '+m.toLocaleString('id-ID');document.getElementById('k').textContent='Keluar: Rp '+k.toLocaleString('id-ID');document.getElementById('saldo').textContent='Rp '+(A+m-k).toLocaleString('id-ID');document.getElementById('l').innerHTML=D.map(d=>`<div class=it><div><b>${d.ket}</b><br><small>${new Date(d.t).toLocaleString()}</small></div><b>${d.tipe=='masuk'?'+':'-'}${d.nom}</b></div>`).join('')||'Kosong'}r()</script></body></html>
